name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is in the matrix because a grader defence broke on it and the
        # 3.12-only job passed: the tamper report was built with the builtins
        # the candidate had just rebound. See CALIBRATION.md round 4.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # G6 checks that the commit history is organised by phase, which a
          # shallow clone hides: the default fetch-depth of 1 leaves one commit
          # and the check reports 0 phases.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Unit tests
        run: .venv/bin/python -m pytest
      - name: Phase gates (offline)
        # G4 needs a real API run and is reported as SKIPPED, never as a pass.
        run: .venv/bin/python gates.py --offline
