name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # G6 checks that the commit history is organised by phase, which a
          # shallow clone hides: the default fetch-depth of 1 leaves one commit
          # and the check reports 0 phases.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Unit tests
        run: .venv/bin/python -m pytest
      - name: Phase gates (offline)
        # G4 needs a real API run and is reported as SKIPPED, never as a pass.
        run: .venv/bin/python gates.py --offline
