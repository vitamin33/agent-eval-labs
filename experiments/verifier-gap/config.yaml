# Every knob the experiment depends on. Nothing here is duplicated in code.

# --- provider -------------------------------------------------------------- #
# `deepseek` (OpenAI-compatible API) or `anthropic`. See RESEARCH.md Amendment
# A3 for why experiment 1 runs on DeepSeek.
provider: deepseek
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY

# The exact model id, not the `deepseek-chat` alias — that alias resolves to
# deepseek-v4-flash server-side, and pinning the alias would hide a silent
# change of model. Every record stores the resolved id and gate G4 fails if a
# run spans more than one.
model: deepseek-v4-flash

# Models known to REJECT the `temperature` parameter with HTTP 400. The loader
# refuses to start rather than discovering this mid-run.
temperature_unsupported_models:
  - claude-opus-5
  - claude-sonnet-5
  - claude-fable-5
  - claude-mythos-5
  - claude-opus-4-8
  - claude-opus-4-7

temperature: 0.0

# DeepSeek v4 models are reasoning models: most completion tokens are reasoning
# tokens that never appear in the response, so a budget sized for the answer
# returns an EMPTY completion with finish_reason="length" — which this harness
# grades as a refusal and would score as model failure.
#
# Measured on this task set (deepseek-v4-flash, generation call):
#   8 of 10 tasks     112 -  2,510 tokens,   2-21s
#   T09              11,375 tokens (11,270 reasoning),  103s
#   T01              30,873 tokens (30,579 reasoning),  280s  <- 294 visible
# T01 truncated at both 4096 and 16384, emitting nothing at all. 49152 leaves
# ~59% headroom over the worst observed case; unused budget costs nothing since
# billing is per token produced. See CALIBRATION.md and truncation_rate, which
# gate G4 enforces at 2%.
max_tokens: 49152

# --- matrix ---------------------------------------------------------------- #
runs_per_cell: 5          # k, for pass^k

# Arm 1 — generation. Measures whether self-verification improves the model's
# own answers (H2, H4).
modes:
  - baseline
  - self_verify

# Arm 2 — injected verification. The model is shown a solution it did not write
# and asked the identical verification question. `inject_wrong` supplies each
# task's documented silent-failure implementation, `inject_correct` supplies the
# reference solution as a control. This gives false_green_rate a denominator we
# control instead of one the generator has to supply by erring (H1, H3, H5).
# See RESEARCH.md Amendment A5.
inject_modes:
  - inject_wrong
  - inject_correct

# The API has no seed parameter. This seeds the harness only: task ordering,
# run indexing, and dry-run mock responses. It does NOT make live sampling
# reproducible. See RESEARCH.md.
seed: 20260819

# --- pricing (USD per 1M tokens, deepseek-v4-flash) ------------------------ #
# Cache hits cost ~31x less than misses, and self-verify's second call resends
# the generation prompt verbatim — so hit/miss must be priced separately or the
# cost_multiplier in H2 is wrong. DeepSeek also charges double during peak
# hours (01:00-04:00 and 06:00-10:00 UTC). Costs are computed at the declared
# tier so the metric is reproducible from raw token counts, rather than
# depending on when the run happened to execute.
pricing:
  tier: peak            # peak | off_peak — peak is the conservative choice
  peak:
    input_cache_miss_per_mtok: 0.44
    input_cache_hit_per_mtok: 0.014
    output_per_mtok: 1.32
  off_peak:
    input_cache_miss_per_mtok: 0.22
    input_cache_hit_per_mtok: 0.007
    output_per_mtok: 0.66

# --- grading --------------------------------------------------------------- #
grading:
  timeout_seconds: 10

# --- calibration target (Phase 4) ------------------------------------------ #
calibration:
  baseline_pass_at_1_min: 0.50
  baseline_pass_at_1_max: 0.70

# --- harness health thresholds enforced by gate G4 ------------------------- #
thresholds:
  max_verdict_parse_failure_rate: 0.02
  # A truncated completion is graded as a non-answer, so truncation caused by a
  # low max_tokens would be mismeasured as model failure.
  max_truncation_rate: 0.02
